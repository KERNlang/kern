name: Release Pipeline

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        type: string
      publish:
        description: Publish packages and sync versions back to dev
        required: true
        type: boolean

jobs:
  release:
    name: ${{ inputs.publish && 'Publish to npm' || 'Release Preflight' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python MCP SDK (for transpiler E2E tests)
        run: pip install mcp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute Release Plan
        id: release-plan
        run: |
          mkdir -p .release
          node scripts/release/plan-cli.mjs \
            --channel "${{ inputs.channel }}" \
            --version "${{ inputs.version }}" \
            --sha "$GITHUB_SHA" > .release/release-plan.json
          cat .release/release-plan.json

      - name: Set package versions
        env:
          RELEASE_VERSION: ${{ steps.release-plan.outputs.version }}
        run: |
          tmp=$(mktemp)
          jq --arg v "$RELEASE_VERSION" '.version = $v' package.json > "$tmp"
          mv "$tmp" package.json

          for pkg in packages/*/package.json; do
            tmp=$(mktemp)
            jq --arg v "$RELEASE_VERSION" '.version = $v' "$pkg" > "$tmp"
            mv "$tmp" "$pkg"
          done

          # Keep KERN_VERSION in lockstep with root package.json so the @generated
          # header in compiled output is truthful. Enforced by check-repo-consistency.mjs.
          # Must happen BEFORE the build below so dist/ carries the correct stamp.
          spec=packages/core/src/spec.ts
          tmp=$(mktemp)
          awk -v v="$RELEASE_VERSION" '{
            if ($0 ~ /^export const KERN_VERSION = /) {
              print "export const KERN_VERSION = '\''" v "'\'';"
            } else {
              print
            }
          }' "$spec" > "$tmp"
          mv "$tmp" "$spec"

      - name: Check repo consistency
        run: npm run check:repo

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Native KERN Tests
        run: pnpm test:kern

      - name: Differential conformance
        run: pnpm check:conformance

      - name: Runner smoke
        run: pnpm test:runner-smoke

      - name: Recover bundle or pack new bundle
        id: release-bundle
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/registry-cli.mjs --mode publish-pack --channel "${{ inputs.channel }}" --version "${{ inputs.version }}" --sha "$GITHUB_SHA"

      - name: Upload new bundle
        id: release-bundle-upload
        if: ${{ inputs.publish && steps.release-bundle.outputs.created == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-bundle.outputs.artifact-name }}
          path: .release/bundle
          retention-days: ${{ steps.release-bundle.outputs.retention-days }}
          if-no-files-found: error
          include-hidden-files: true

      - name: Confirm durable bundle
        if: ${{ inputs.publish && steps.release-bundle.outputs.created == 'true' }}
        run: >-
          node scripts/release/registry-cli.mjs
          --mode confirm-bundle
          --channel "${{ inputs.channel }}"
          --version "${{ inputs.version }}"
          --sha "$GITHUB_SHA"
          --artifact-id "${{ steps.release-bundle-upload.outputs.artifact-id }}"
          --artifact-digest "${{ steps.release-bundle-upload.outputs.artifact-digest }}"

      - name: Reconcile versions and staging tags
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release/registry-cli.mjs --mode publish-reconcile --channel "${{ inputs.channel }}" --version "${{ inputs.version }}" --sha "$GITHUB_SHA"

      - name: Create Promotion Snapshot
        id: promotion-snapshot
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/registry-cli.mjs --mode publish-snapshot --channel "${{ inputs.channel }}" --version "${{ inputs.version }}" --sha "$GITHUB_SHA"

      - name: Upload Promotion Snapshot
        id: promotion-snapshot-upload
        if: ${{ inputs.publish && steps.promotion-snapshot.outputs.created == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.promotion-snapshot.outputs.artifact-name }}
          path: .release/${{ steps.promotion-snapshot.outputs.artifact-name }}.json
          retention-days: ${{ steps.promotion-snapshot.outputs.retention-days }}
          if-no-files-found: error
          include-hidden-files: true

      - name: Confirm durable promotion snapshot
        if: ${{ inputs.publish && steps.promotion-snapshot.outputs.created == 'true' }}
        run: >-
          node scripts/release/registry-cli.mjs
          --mode confirm-snapshot
          --channel "${{ inputs.channel }}"
          --version "${{ inputs.version }}"
          --sha "$GITHUB_SHA"
          --artifact-id "${{ steps.promotion-snapshot-upload.outputs.artifact-id }}"
          --artifact-digest "${{ steps.promotion-snapshot-upload.outputs.artifact-digest }}"

      - name: Promote public tags
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release-plan.outputs.dist_tag }}
        run: node scripts/release/registry-cli.mjs --mode publish-promote --channel "${{ inputs.channel }}" --version "${{ inputs.version }}" --sha "$GITHUB_SHA" --tag "$DIST_TAG"

      - name: Run clean registry smoke tests
        if: ${{ inputs.publish }}
        run: node scripts/release/registry-cli.mjs --mode publish-smoke --channel "${{ inputs.channel }}" --version "${{ inputs.version }}" --sha "$GITHUB_SHA"

      - name: Run Artifact Wall
        if: ${{ !inputs.publish }}
        run: node scripts/release/registry-cli.mjs --mode preflight --channel "${{ inputs.channel }}" --version "${{ inputs.version }}" --sha "$GITHUB_SHA"

      - name: Upload Journal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/journal.json
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Sync versions back to dev
        if: ${{ inputs.publish && steps.release-plan.outputs.syncs_dev == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release-plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The publish/preflight checkout has local version edits from the
          # earlier "Set package versions" step. Discard those CI-only edits
          # before switching to dev; the same version bump is applied below
          # and committed on dev intentionally.
          git reset --hard HEAD
          git clean -fd
          git fetch origin dev
          # Apply the version bump on top of the ACTUAL origin/dev tip, not
          # main's. dev intentionally carries independent commits (canary
          # triggers, dev-only fixes that haven't shipped via main yet) — the
          # previous `checkout -B dev HEAD` quietly tried to overwrite them
          # with `main + bump` and the push was correctly rejected as
          # non-fast-forward on the v3.5.6 release (PR #344, 2026-05-29).
          # The bump loop below iterates EXISTING package.json files only, so
          # a deleted-on-main / present-on-dev package is updated in place,
          # not resurrected; a true dev↔main divergence is resolved by the
          # next dev→main PR, not by this sync step.
          git checkout -B dev origin/dev

          tmp=$(mktemp)
          jq --arg v "$RELEASE_VERSION" '.version = $v' package.json > "$tmp"
          mv "$tmp" package.json

          for pkg in packages/*/package.json; do
            tmp=$(mktemp)
            jq --arg v "$RELEASE_VERSION" '.version = $v' "$pkg" > "$tmp"
            mv "$tmp" "$pkg"
          done

          spec=packages/core/src/spec.ts
          tmp=$(mktemp)
          awk -v v="$RELEASE_VERSION" '{
            if ($0 ~ /^export const KERN_VERSION = /) {
              print "export const KERN_VERSION = '\''" v "'\'';"
            } else {
              print
            }
          }' "$spec" > "$tmp"
          mv "$tmp" "$spec"

          git add package.json packages/*/package.json packages/core/src/spec.ts
          if git diff --cached --quiet; then
            echo "Versions already synced to v${RELEASE_VERSION}; nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync versions to v${RELEASE_VERSION} [skip ci]"
          # Retry to absorb a concurrent push to dev (e.g. canary-publish
          # writing a tag while we're mid-step). Rebase the version-bump
          # commit onto the new tip and re-push, up to 3 attempts. Plain
          # push, never --force: a truly incompatible history should still
          # fail loudly rather than silently overwrite dev-only work.
          push_ok=false
          for attempt in 1 2 3; do
            if git push --no-verify origin dev; then
              push_ok=true
              break
            fi
            echo "Push attempt $attempt rejected; refetching origin/dev and rebasing..."
            git fetch origin dev
            git rebase origin/dev || { git rebase --abort; exit 1; }
          done
          if ! $push_ok; then
            echo "Failed to push to origin/dev after 3 attempts." >&2
            exit 1
          fi
