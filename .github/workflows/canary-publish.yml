name: Canary Publish

# Manual-only KERN 5 canary publication from main.
#
# Automatic publication stays disabled until the release pipeline can prove an
# exact-SHA green CI attestation and resume safely after partial npm publication.
# The operator must verify the selected main commit is green before dispatching.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Publish canary to npm
    if: >-
      github.repository == 'KERNlang/kern' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'main'
    runs-on: ubuntu-latest

    env:
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python MCP SDK (for transpiler E2E tests)
        run: pip install mcp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute canary version
        id: release-plan
        run: |
          mkdir -p .release
          node scripts/release/plan-cli.mjs \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" | tee .release/release-plan.json

      - name: Set package versions
        env:
          CANARY_VERSION: ${{ steps.release-plan.outputs.version }}
        run: |
          tmp=$(mktemp)
          jq --arg v "$CANARY_VERSION" '.version = $v' package.json > "$tmp"
          mv "$tmp" package.json

          for pkg in packages/*/package.json; do
            tmp=$(mktemp)
            jq --arg v "$CANARY_VERSION" '.version = $v' "$pkg" > "$tmp"
            mv "$tmp" "$pkg"
          done

          spec=packages/core/src/spec.ts
          tmp=$(mktemp)
          awk -v v="$CANARY_VERSION" '{
            if ($0 ~ /^export const KERN_VERSION = /) {
              print "export const KERN_VERSION = '\''" v "'\'';"
            } else {
              print
            }
          }' "$spec" > "$tmp"
          mv "$tmp" "$spec"

      - name: Check repo consistency
        run: npm run check:repo

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Native KERN Tests
        run: pnpm test:kern

      - name: Differential conformance
        run: pnpm check:conformance

      - name: Runner smoke
        run: pnpm test:runner-smoke

      - name: Recover bundle or pack new bundle
        id: release-bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/registry-cli.mjs \
            --mode publish-pack \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Upload new bundle
        id: release-bundle-upload
        if: ${{ steps.release-bundle.outputs.created == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-bundle.outputs.artifact-name }}
          path: .release/bundle
          retention-days: ${{ steps.release-bundle.outputs.retention-days }}
          if-no-files-found: error
          include-hidden-files: true

      - name: Confirm durable bundle
        if: ${{ steps.release-bundle.outputs.created == 'true' }}
        run: |
          node scripts/release/registry-cli.mjs \
            --mode confirm-bundle \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --artifact-id "${{ steps.release-bundle-upload.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.release-bundle-upload.outputs.artifact-digest }}"

      - name: Reconcile versions and staging tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/release/registry-cli.mjs \
            --mode publish-reconcile \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Create Promotion Snapshot
        id: promotion-snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/registry-cli.mjs \
            --mode publish-snapshot \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Upload Promotion Snapshot
        id: promotion-snapshot-upload
        if: ${{ steps.promotion-snapshot.outputs.created == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.promotion-snapshot.outputs.artifact-name }}
          path: .release/${{ steps.promotion-snapshot.outputs.artifact-name }}.json
          retention-days: ${{ steps.promotion-snapshot.outputs.retention-days }}
          if-no-files-found: error
          include-hidden-files: true

      - name: Confirm durable promotion snapshot
        if: ${{ steps.promotion-snapshot.outputs.created == 'true' }}
        run: |
          node scripts/release/registry-cli.mjs \
            --mode confirm-snapshot \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --artifact-id "${{ steps.promotion-snapshot-upload.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.promotion-snapshot-upload.outputs.artifact-digest }}"

      - name: Promote public tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.release-plan.outputs.dist_tag }}
        run: |
          node scripts/release/registry-cli.mjs \
            --mode publish-promote \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --tag "$NPM_TAG"

      - name: Run clean registry smoke tests
        run: |
          node scripts/release/registry-cli.mjs \
            --mode publish-smoke \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Upload Journal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/journal.json
          if-no-files-found: ignore
          include-hidden-files: true
