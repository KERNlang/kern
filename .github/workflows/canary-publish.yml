name: Canary Publish

# Publishes a canary build to npm for every GREEN commit on dev.
#
# This workflow is gated on CI success via `workflow_run`: it fires only after
# the "CI" workflow completes on dev, and the job runs only when that CI run
# concluded successfully. That means the full test suite (build, tests,
# test:kern, review, semantics harness) is exercised exactly once — by CI — and
# the canary job never re-runs it. The canary job only rebuilds (publish needs
# dist/) and publishes the exact commit CI tested.
#
# IMPORTANT: `workflow_run` triggers are read ONLY from the default branch
# (main). This file must be merged to main before the trigger activates. Until
# then, use the `workflow_dispatch` escape hatch to publish a canary manually.

on:
  workflow_run:
    workflows: ['CI']
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish under
        required: false
        default: canary
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish canary to npm
    # Only publish green commits. Manual dispatch bypasses the CI gate (the
    # operator owns that decision); workflow_run runs require conclusion=success.
    if: >-
      github.repository == 'KERNlang/kern' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    env:
      # The commit CI actually tested (workflow_run), or the dispatched ref.
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the exact commit CI validated, not the default-branch HEAD
          # (github.sha lies on workflow_run events).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute canary version
        env:
          NPM_TAG_INPUT: ${{ github.event.inputs.npm_tag || 'canary' }}
        run: |
          BASE_VERSION=$(jq -r '.version' package.json)
          if ! printf '%s\n' "$BASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Root package version must be stable semver, got $BASE_VERSION"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<EOF
          $BASE_VERSION
          EOF

          NEXT_PATCH=$((PATCH + 1))
          SHORT_SHA=$(printf '%s' "$BUILD_SHA" | cut -c1-8)
          CANARY_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-canary.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.${SHORT_SHA}"
          NPM_TAG="${NPM_TAG_INPUT:-canary}"

          if ! printf '%s\n' "$NPM_TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::npm tag contains invalid characters: $NPM_TAG"
            exit 1
          fi

          echo "CANARY_VERSION=$CANARY_VERSION" >> "$GITHUB_ENV"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "Canary version: $CANARY_VERSION"
          echo "npm dist-tag: $NPM_TAG"

      - name: Set package versions
        run: |
          tmp=$(mktemp)
          jq --arg v "$CANARY_VERSION" '.version = $v' package.json > "$tmp"
          mv "$tmp" package.json

          for pkg in packages/*/package.json; do
            tmp=$(mktemp)
            jq --arg v "$CANARY_VERSION" '.version = $v' "$pkg" > "$tmp"
            mv "$tmp" "$pkg"
          done

          spec=packages/core/src/spec.ts
          tmp=$(mktemp)
          awk -v v="$CANARY_VERSION" '{
            if ($0 ~ /^export const KERN_VERSION = /) {
              print "export const KERN_VERSION = '\''" v "'\'';"
            } else {
              print
            }
          }' "$spec" > "$tmp"
          mv "$tmp" "$spec"

      - name: Check repo consistency
        run: npm run check:repo

      - name: Build
        run: pnpm build

      - name: Publish dry run
        run: pnpm -r publish --dry-run --no-git-checks --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages
        run: pnpm -r publish --no-git-checks --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
