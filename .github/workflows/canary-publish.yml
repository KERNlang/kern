name: Canary Publish

# Manual-only KERN 5 canary publication from main.
#
# Automatic publication stays disabled until the release pipeline can prove an
# exact-SHA green CI attestation and resume safely after partial npm publication.
# The operator must verify the selected main commit is green before dispatching.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish canary to npm
    if: >-
      github.repository == 'KERNlang/kern' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'main'
    runs-on: ubuntu-latest

    env:
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute canary version
        id: release-plan
        run: |
          node scripts/release/plan-cli.mjs \
            --channel canary \
            --sha "$BUILD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Set package versions
        run: |
          tmp=$(mktemp)
          jq --arg v "$CANARY_VERSION" '.version = $v' package.json > "$tmp"
          mv "$tmp" package.json

          for pkg in packages/*/package.json; do
            tmp=$(mktemp)
            jq --arg v "$CANARY_VERSION" '.version = $v' "$pkg" > "$tmp"
            mv "$tmp" "$pkg"
          done

          spec=packages/core/src/spec.ts
          tmp=$(mktemp)
          awk -v v="$CANARY_VERSION" '{
            if ($0 ~ /^export const KERN_VERSION = /) {
              print "export const KERN_VERSION = '\''" v "'\'';"
            } else {
              print
            }
          }' "$spec" > "$tmp"
          mv "$tmp" "$spec"

      - name: Check repo consistency
        run: npm run check:repo

      - name: Build
        run: pnpm build

      - name: Publish dry run
        run: pnpm -r publish --dry-run --no-git-checks --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages
        run: pnpm -r publish --no-git-checks --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
