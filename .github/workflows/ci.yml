name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint
      - name: CI test tier contract
        run: pnpm test:ci-contract
      - name: Build
        run: pnpm build
      - name: Verify kern facades in sync
        run: pnpm --filter @kernlang/test kern:check
      - name: Rule coverage gate
        run: pnpm check:rule-coverage
      - name: Python codegen quality gate
        run: pnpm check:python-codegen
      - name: Differential conformance
        run: pnpm check:conformance
      - name: Contract docs drift
        run: pnpm docs:contracts:check

  infrastructure-contracts:
    name: Infrastructure contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Infrastructure contracts
        run: pnpm test:infra:contracts

  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package tests excluding the differential harness
        run: pnpm -r --filter '!kern-monorepo' --filter '!@kernlang/review-python' test --testPathIgnorePatterns=ir-semantics

  semantics:
    name: IR semantics contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Differential harness
        shell: bash
        run: |
          set -o pipefail
          status=0
          pnpm test:ir-semantics 2>&1 | tee semantics.log || status=$?
          {
            echo "## IR-semantics contracts"
            echo ""
            pnpm docs:contracts
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-docs
          path: |
            generated/contracts/registry.json
            semantics.log
          if-no-files-found: warn

  frontend-foundation:
    name: Frontend foundation
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend foundation
        run: pnpm test:pr-frontend-foundation

  frontend-properties-core:
    name: Frontend generic properties core
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend generic properties core
        run: pnpm test:pr-frontend-properties-core

  frontend-properties-extended:
    name: Frontend generic properties extended
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend generic properties extended
        run: pnpm test:pr-frontend-properties-extended

  frontend-composition:
    name: Frontend composition
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Focused frontend composition
        run: pnpm test:pr-frontend-composition

  frontend-language:
    name: Frontend F1 through F4
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend language layers
        run: pnpm test:pr-frontend-language

  frontend-tooling:
    name: Frontend canonicalizer, checker, and formatter
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend tooling
        run: pnpm test:pr-frontend-tooling

  product-smoke:
    name: Native, runner, and preview gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Native KERN tests
        run: pnpm test:kern
      - name: Runner smoke and browser budget
        run: pnpm test:runner-smoke
      - name: KIR Review Preview
        run: pnpm test:kern-review-kir-preview

  build-and-test:
    name: Build & Test
    if: ${{ always() }}
    needs: [quality, infrastructure-contracts, package-tests, semantics, frontend-foundation, frontend-properties-core, frontend-properties-extended, frontend-composition, frontend-language, frontend-tooling, product-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane to succeed
        run: |
          for result in "${{ needs.quality.result }}" "${{ needs.infrastructure-contracts.result }}" "${{ needs.package-tests.result }}" "${{ needs.semantics.result }}" "${{ needs.frontend-foundation.result }}" "${{ needs.frontend-properties-core.result }}" "${{ needs.frontend-properties-extended.result }}" "${{ needs.frontend-composition.result }}" "${{ needs.frontend-language.result }}" "${{ needs.frontend-tooling.result }}" "${{ needs.product-smoke.result }}"; do
            if [ "$result" != success ]; then
              echo "A required CI lane did not succeed: $result"
              exit 1
            fi
          done
