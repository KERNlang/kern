name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test & Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python MCP SDK (for transpiler E2E tests)
        run: pip install mcp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify kern facades in sync
        run: pnpm --filter @kernlang/test kern:check

      - name: Rule coverage gate
        run: pnpm check:rule-coverage

      - name: Python codegen quality gate
        run: pnpm check:python-codegen

      - name: Test (excluding IR-semantics harness)
        run: pnpm test:non-semantics

      - name: Contract docs drift
        run: pnpm docs:contracts:check

      # PR-5b — IR-semantics differential harness lives in its own step (not
      # folded into `pnpm test:non-semantics`) so its contract-docs summary
      # stays separate; local `pnpm test` keeps running everything. Graduated
      # to a blocking step on 2026-06-01 (UTC) — the burn-in window closed with
      # the harness green, so the date-gate, the `KERN_SEMANTICS_GATE` repo-var
      # escape hatch, and the expiry guard were removed.
      - name: Differential harness (IR semantics)
        shell: bash
        run: |
          # PR-5 buddy-review fix (codex 0.97): capture pipeline status BEFORE
          # the summary block, then exit with it. Without `exit "$status"` the
          # step's exit code is whatever the last command in the run block
          # produces (the summary `>>` redirect, always 0), which silently
          # swallows harness failures.
          set -o pipefail
          status=0
          pnpm test:ir-semantics 2>&1 | tee semantics.log || status=$?
          {
            echo "## IR-semantics contracts"
            echo ""
            pnpm docs:contracts
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-docs
          path: |
            generated/contracts/registry.json
            semantics.log
          if-no-files-found: warn

      - name: Native KERN Tests
        run: pnpm test:kern

      - name: KERN Review
        run: node packages/cli/dist/cli.js review packages/ --recursive
