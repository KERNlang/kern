name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint
      - name: CI test tier contract
        run: pnpm test:ci-contract
      - name: Build
        run: pnpm build
      - name: Verify kern facades in sync
        run: pnpm --filter @kernlang/test kern:check
      - name: Rule coverage gate
        run: pnpm check:rule-coverage
      - name: Python codegen quality gate
        run: pnpm check:python-codegen
      - name: Differential conformance
        run: pnpm check:conformance
      - name: Contract docs drift
        run: pnpm docs:contracts:check

  infrastructure-contracts:
    name: Infrastructure contracts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Infrastructure contracts
        run: pnpm test:infra:contracts

  package-tests:
    name: Package tests excluding review and IR semantics
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build package train
        run: pnpm build:packages
      - name: Package tests excluding review and IR semantics
        run: node scripts/ci/run-prebuilt-package-tests.mjs --exclude @kernlang/review --exclude @kernlang/review-python -- --testPathIgnorePatterns=ir-semantics

  package-tests-review:
    name: Review package tests excluding IR semantics
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build package train
        run: pnpm build:packages
      - name: Review package tests excluding IR semantics
        run: node scripts/ci/run-prebuilt-package-tests.mjs --only @kernlang/review -- --testPathIgnorePatterns=ir-semantics

  semantics:
    name: IR semantics contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Differential harness
        shell: bash
        run: |
          set -o pipefail
          status=0
          pnpm test:ir-semantics 2>&1 | tee semantics.log || status=$?
          {
            echo "## IR-semantics contracts"
            echo ""
            pnpm docs:contracts
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-docs
          path: |
            generated/contracts/registry.json
            semantics.log
          if-no-files-found: warn

  frontend-foundation:
    name: Frontend foundation
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend foundation
        run: pnpm test:pr-frontend-foundation

  frontend-properties-core:
    name: Frontend generic properties core
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend generic properties core
        run: pnpm test:pr-frontend-properties-core

  frontend-properties-extended:
    name: Frontend generic properties extended (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: style theme diagnostics
            script: test:kern-frontend-generic-property-style-theme-diagnostics
          - name: evolved hints
            script: test:kern-frontend-evolved-hints
          - name: keyword handlers
            script: test:kern-frontend-keyword-handlers
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build core
        run: pnpm --filter @kernlang/core build
      - name: Frontend generic properties extended shard
        run: node scripts/ci/run-prebuilt-test.mjs ${{ matrix.script }}

  frontend-composition:
    name: Frontend composition (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: successful line composition
            script: test:kern-frontend-successful-line-composition:focused
          - name: closure
            script: test:kern-frontend-closure
          - name: runtime text cache
            script: test:kern-frontend-runtime-text-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build core
        run: pnpm --filter @kernlang/core build
      - name: Focused frontend composition shard
        run: node scripts/ci/run-prebuilt-test.mjs ${{ matrix.script }}

  frontend-language:
    name: Frontend F1 through F4 (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: F1
            script: test:kern-frontend-f1
          - name: F1 scan
            script: test:kern-frontend-f1-scan
          - name: F2 expression
            script: test:kern-frontend-f2-expression
          - name: F2 batch
            script: test:kern-frontend-f2-batch
          - name: F3 line tree
            script: test:kern-frontend-f3-line-tree
          - name: F4 declarations
            script: test:kern-frontend-f4-declarations
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build core
        run: pnpm --filter @kernlang/core build
      - name: Frontend language layer shard
        run: node scripts/ci/run-prebuilt-test.mjs ${{ matrix.script }}

  frontend-tooling:
    name: Frontend tooling (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: canonicalizer
            script: test:kern-canonicalizer
          - name: checker
            script: test:kern-checker
          - name: formatter
            script: test:kern-formatter
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build core
        run: pnpm --filter @kernlang/core build
      - name: Build CLI
        run: pnpm --filter @kernlang/cli build
      - name: Frontend tooling shard
        run: node scripts/ci/run-prebuilt-test.mjs ${{ matrix.script }}

  product-smoke:
    name: Native, runner, and preview gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python MCP SDK
        run: pip install mcp
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Native KERN tests
        run: pnpm test:kern
      - name: Runner smoke and browser budget
        run: pnpm test:runner-smoke
      - name: Build package train
        run: pnpm build
      - name: KIR Review Preview
        run: pnpm test:kern-review-kir-preview

  build-and-test:
    name: Build & Test
    if: ${{ always() }}
    needs: [quality, infrastructure-contracts, package-tests, package-tests-review, semantics, frontend-foundation, frontend-properties-core, frontend-properties-extended, frontend-composition, frontend-language, frontend-tooling, product-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane to succeed
        run: |
          for result in "${{ needs.quality.result }}" "${{ needs.infrastructure-contracts.result }}" "${{ needs.package-tests.result }}" "${{ needs.package-tests-review.result }}" "${{ needs.semantics.result }}" "${{ needs.frontend-foundation.result }}" "${{ needs.frontend-properties-core.result }}" "${{ needs.frontend-properties-extended.result }}" "${{ needs.frontend-composition.result }}" "${{ needs.frontend-language.result }}" "${{ needs.frontend-tooling.result }}" "${{ needs.product-smoke.result }}"; do
            if [ "$result" != success ]; then
              echo "A required CI lane did not succeed: $result"
              exit 1
            fi
          done
