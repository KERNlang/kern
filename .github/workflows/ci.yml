name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python MCP SDK (for transpiler E2E tests)
        run: pip install mcp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify kern facades in sync
        run: pnpm --filter @kernlang/test kern:check

      - name: Rule coverage gate
        run: pnpm check:rule-coverage

      - name: Python codegen quality gate
        run: pnpm check:python-codegen

      # Differential parity gate: executes portable KERN expressions through BOTH
      # the Python (FastAPI) and Express (JS) codegen paths and diffs the runtime
      # results. Unlike the codegen quality gate above (ast-valid but semantically
      # blind), this proves Python<->TS behavioral parity by actually running the
      # generated artifacts -- it is what caught the host-builtin and array/string
      # method portability bug cliffs. Needs python3 (set up above) + the built
      # core/python/express dist (the script builds them).
      - name: Differential conformance (Python<->Express parity)
        run: pnpm check:conformance

      - name: Test (excluding IR-semantics harness)
        run: pnpm test:non-semantics

      - name: Contract docs drift
        run: pnpm docs:contracts:check

      # PR-5b — IR-semantics differential harness lives in its own step so the
      # burn-in date-gate can decouple it from blocking CI without removing
      # the harness from local `pnpm test` (which keeps running everything).
      # First blocking day is 2026-06-01 (UTC); the `KERN_SEMANTICS_GATE` repo
      # variable is a three-way escape hatch:
      #   - `blocking`               → force blocking (early flip)
      #   - any other non-empty val  → force non-blocking (delay past deadline)
      #   - unset / empty            → follow the date gate
      # The expiry step fails CI only when the deadline has passed AND no
      # override is set, so the deadline cannot silently slip but can be
      # explicitly extended by setting the variable.
      - name: Compute differential-harness gate
        id: gate
        shell: bash
        env:
          KERN_SEMANTICS_GATE: ${{ vars.KERN_SEMANTICS_GATE }}
        run: |
          BURNIN_FLIPS_ON="2026-06-01"
          TODAY=$(date -u +%Y-%m-%d)
          case "$KERN_SEMANTICS_GATE" in
            blocking)
              blocking=true ;;
            "")
              if [[ "$TODAY" > "$BURNIN_FLIPS_ON" || "$TODAY" == "$BURNIN_FLIPS_ON" ]]; then
                blocking=true
              else
                blocking=false
              fi ;;
            *)
              blocking=false ;;
          esac
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          echo "burnin_flips_on=$BURNIN_FLIPS_ON" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Differential harness (IR semantics)
        continue-on-error: ${{ steps.gate.outputs.blocking != 'true' }}
        shell: bash
        run: |
          # PR-5 buddy-review fix (codex 0.97): capture pipeline status BEFORE
          # the summary block, then exit with it. Without `exit "$status"` the
          # step's exit code is whatever the last command in the run block
          # produces (the summary `>>` redirect, always 0), which silently
          # swallows harness failures after burn-in flips to blocking.
          set -o pipefail
          status=0
          pnpm test:ir-semantics 2>&1 | tee semantics.log || status=$?
          {
            echo "## IR-semantics contracts"
            echo ""
            echo "_Burn-in flips on ${{ steps.gate.outputs.burnin_flips_on }} (today ${{ steps.gate.outputs.today }}); blocking=${{ steps.gate.outputs.blocking }}_"
            echo ""
            pnpm docs:contracts
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Hard expiry — fails CI only when the date has passed AND no override
      # at all is set (so unset is a hard error after deadline, but an
      # explicit non-`blocking` override still delays).
      - name: Enforce burn-in expiry
        shell: bash
        env:
          KERN_SEMANTICS_GATE: ${{ vars.KERN_SEMANTICS_GATE }}
        run: |
          FLIPS_ON="${{ steps.gate.outputs.burnin_flips_on }}"
          TODAY="${{ steps.gate.outputs.today }}"
          if [[ ( "$TODAY" > "$FLIPS_ON" || "$TODAY" == "$FLIPS_ON" ) && -z "$KERN_SEMANTICS_GATE" ]]; then
            echo "Burn-in deadline ($FLIPS_ON) has passed but KERN_SEMANTICS_GATE is unset." >&2
            echo "Either set the variable to 'blocking' (or any non-blocking override to delay), " >&2
            echo "or land a PR removing continue-on-error from the harness step." >&2
            exit 1
          fi

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-docs
          path: |
            generated/contracts/registry.json
            semantics.log
          if-no-files-found: warn

      - name: Native KERN Tests
        run: pnpm test:kern

      # PR review is handled by the kern-guard GitHub App (KERNlang/kern-guard),
      # installed on this repo — it runs the same @kernlang/review engine on the
      # PR head (changed files only, baseline-deduped, posted as Checks
      # annotations) in parallel with this workflow. The old in-CI
      # `kern review packages/ --recursive` step was removed so review no longer
      # serializes inside Actions. Local fail-fast still runs rule-based review
      # in the pre-push hook; the agon multi-engine review remains the hard gate
      # before commits.
